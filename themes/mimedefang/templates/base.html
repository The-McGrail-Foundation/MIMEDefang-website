<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="{{ SITEURL }}/theme/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="{{ SITEURL }}/theme/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ SITEURL }}/theme/css/custom.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="{{ SITEURL }}/theme/images/favicon.ico"/>
    <link rel="canonical" href="{{ SITEURL_ABSOLUTE }}/{{ page.url }}">
    <meta property="og:site_name" content="{{ SITENAME }}" />
    <meta property="og:image" content="{{ SITEURL_ABSOLUTE }}/theme/images/mimedefang_logo9-300x150.png" />
    <meta name="title" property="og:title" content="{{ page.title }}" />
    <meta name="description" content="{{ page.description }}" />
    <meta property="og:description" content="{{ page.description }}" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "{{ SITEURL_ABSOLUTE }}/#organization",
          "name": "The McGrail Foundation",
          "url": "https://github.com/The-McGrail-Foundation",
          "logo": "{{ SITEURL_ABSOLUTE }}/theme/images/mimedefang_logo9-300x150.png",
          "sameAs": ["https://github.com/The-McGrail-Foundation"]
        },
        {
          "@type": "Organization",
          "@id": "{{ SITEURL_ABSOLUTE }}/#community",
          "name": "MIMEDefang Community",
          "url": "{{ SITEURL_ABSOLUTE }}/mailing-list/",
          "parentOrganization": {"@id": "{{ SITEURL_ABSOLUTE }}/#organization"}
        },
        {
          "@type": "WebSite",
          "@id": "{{ SITEURL_ABSOLUTE }}/#website",
          "url": "{{ SITEURL_ABSOLUTE }}/",
          "name": "{{ SITENAME }}",
          "inLanguage": "{{ DEFAULT_LANG }}",
          "publisher": {"@id": "{{ SITEURL_ABSOLUTE }}/#organization"}
        },
        {
          "@type": "SoftwareApplication",
          "@id": "{{ SITEURL_ABSOLUTE }}/#software",
          "name": "MIMEDefang",
          "url": "{{ SITEURL_ABSOLUTE }}/",
          "downloadUrl": "{{ SITEURL_ABSOLUTE }}/download/",
          "softwareHelp": "{{ SITEURL_ABSOLUTE }}/documentation/",
          "applicationCategory": "SecurityApplication",
          "operatingSystem": "Linux, FreeBSD, Solaris",
          "description": "MIMEDefang is an open-source email filtering framework that integrates with Sendmail and Postfix via the Milter API. Write custom filtering policies in Perl to inspect, modify, or reject email messages during the SMTP transaction.",
          "softwareVersion": "{{ MD_VER }}",
          "datePublished": "{{ MD_VER_DATE }}",
          "releaseNotes": "{{ SITEURL_ABSOLUTE }}/documentation/Changelog.html",
          "license": "https://www.gnu.org/licenses/gpl-2.0.html",
          "programmingLanguage": ["Perl", "C"],
          "author": {"@id": "{{ SITEURL_ABSOLUTE }}/#organization"},
          "publisher": {"@id": "{{ SITEURL_ABSOLUTE }}/#organization"},
          "maintainer": {"@id": "{{ SITEURL_ABSOLUTE }}/#community"},
          "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
          "featureList": ["MIME stream inspection and modification", "SpamAssassin integration", "ClamAV integration", "rspamd integration", "DKIM signing", "SPF and DMARC enforcement", "Attachment stripping", "Custom Perl scripting"],
          "softwareRequirements": "Sendmail 8.12+ or Postfix 2.3+, Perl 5.10+",
          "codeRepository": "https://github.com/The-McGrail-Foundation/MIMEDefang",
          "sameAs": [
            "https://github.com/The-McGrail-Foundation/MIMEDefang",
            "https://metacpan.org/dist/Mail-MIMEDefang",
            "https://en.wikipedia.org/wiki/MIMEDefang",
            "https://www.wikidata.org/wiki/Q14093494"
          ]
        }
      ]
    }
    </script>
    {% if page.ld_json %}
    <script type="application/ld+json">
    {{ page.ld_json | safe }}
    </script>
    {% endif %}
    <title>MIMEDefang - {{ page.title }}</title>
</head>

<body>
    <header>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <div class="b-box"></div>
            <a class="navbar-brand" href="/">
                <img src="{{ SITEURL }}/theme/images/mimedefang_logo9-300x150.png" class="img-fluid" alt="MIMEDefang" width="152" height="76">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
	        {% for title, link in MENUITEMS %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ link }}">{{ title }}</a>
                    </li>
                {% endfor %}
                </ul>
            </div>
        </div>
    </nav>
    </header>
    <main>
